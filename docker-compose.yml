version: "3.8"

services:
  # Main Real-Time Inference & Distance Service
  rpi-vision:
    image: rpi-edge-vision:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpi_vision_app
    devices:
      - "/dev/video0:/dev/video0"
    privileged: true
    group_add:
      - video
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models
      # X11 Display pass-through for high-performance OpenCV GUI window
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=4
      - DISPLAY=${DISPLAY:-:0}
    command: ["--config", "config/default.yaml"]

  # One-shot Transfer Learning Service for Custom Object Detection
  train-detector:
    image: rpi-edge-vision:latest
    container_name: rpi_train_detector
    profiles: ["train"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    entrypoint: ["python3", "-m", "src.train_detector"]
    command: ["--data", "data/custom_dataset.yaml", "--epochs", "20", "--batch", "8", "--imgsz", "320"]

  # One-shot Transfer Learning Service for Custom Image Classification
  train-classifier:
    image: rpi-edge-vision:latest
    container_name: rpi_train_classifier
    profiles: ["train"]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    entrypoint: ["python3", "-m", "src.train_classifier"]
    command: ["--data", "data/classification_dataset", "--epochs", "15", "--batch", "16"]
